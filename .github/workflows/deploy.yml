name: Deploy AWS MVP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      CDK_DEFAULT_REGION: us-east-1
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_EVALUATOR_MODEL: ${{ secrets.OPENAI_EVALUATOR_MODEL || 'gpt-5.4-mini' }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://vjatwbhknc.execute-api.us-east-1.amazonaws.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Resolve stack target
        id: target
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "stack_id=Hl7CapabilityAssessmentLiveV2Stack" >> "$GITHUB_OUTPUT"
            echo "stack_name=Hl7CapabilityAssessmentLiveV2Stack" >> "$GITHUB_OUTPUT"
            echo "action=deploy" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.action }}" == "closed" ]]; then
            echo "stack_id=AiCapabilityAssessmentToolPr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "stack_name=AiCapabilityAssessmentToolPr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "action=destroy" >> "$GITHUB_OUTPUT"
          else
            echo "stack_id=AiCapabilityAssessmentToolPr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "stack_name=AiCapabilityAssessmentToolPr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "action=deploy" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test clinical workflow
        run: npm run test:workflow

      - name: Synthesize CDK
        env:
          CDK_STACK_ID: ${{ steps.target.outputs.stack_id }}
          CDK_STACK_NAME: ${{ steps.target.outputs.stack_name }}
        run: npm run infra:synth

      - name: Deploy stack
        if: steps.target.outputs.action == 'deploy'
        env:
          CDK_STACK_ID: ${{ steps.target.outputs.stack_id }}
          CDK_STACK_NAME: ${{ steps.target.outputs.stack_name }}
        run: npm run infra:deploy -- --require-approval never $CDK_STACK_ID

      - name: Check preview stack
        if: steps.target.outputs.action == 'destroy'
        id: preview
        shell: bash
        run: |
          if aws cloudformation describe-stacks --stack-name "${{ steps.target.outputs.stack_name }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Destroy preview stack
        if: steps.target.outputs.action == 'destroy' && steps.preview.outputs.exists == 'true'
        env:
          CDK_STACK_ID: ${{ steps.target.outputs.stack_id }}
          CDK_STACK_NAME: ${{ steps.target.outputs.stack_name }}
        run: npx cdk destroy --force $CDK_STACK_ID
